---
openapi: 3.0.3
info:
  title: Top Dance Academy API
  version: v1
  description: REST API shared by the Top Dance web and mobile apps.
servers:
- url: http://localhost:3001
  description: Local development
paths:
  "/api/v1/auth/csrf":
    get:
      summary: CSRF token for cookie-authenticated requests
      tags:
      - Auth
      operationId: getCsrfToken
      responses:
        '200':
          description: token for X-CSRF-Token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CsrfToken"
  "/api/v1/auth/register":
    post:
      summary: Create a student account
      tags:
      - Auth
      operationId: register
      parameters:
      - "$ref": "#/components/parameters/authTransport"
      - "$ref": "#/components/parameters/csrfToken"
      - "$ref": "#/components/parameters/locale"
      responses:
        '201':
          description: account created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuthSession"
        '422':
          description: invalid attributes
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - email
              - password
              properties:
                name:
                  type: string
                email:
                  type: string
                password:
                  type: string
  "/api/v1/auth/login":
    post:
      summary: Sign in with email and password
      tags:
      - Auth
      operationId: login
      parameters:
      - "$ref": "#/components/parameters/authTransport"
      - "$ref": "#/components/parameters/csrfToken"
      responses:
        '200':
          description: signed in
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuthSession"
        '401':
          description: unknown email or wrong password
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              properties:
                email:
                  type: string
                password:
                  type: string
  "/api/v1/auth/google":
    post:
      summary: Sign in with a Google ID token
      tags:
      - Auth
      operationId: googleAuth
      parameters:
      - "$ref": "#/components/parameters/authTransport"
      - "$ref": "#/components/parameters/csrfToken"
      responses:
        '200':
          description: signed in with Google
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuthSession"
        '422':
          description: Google sign-in is not configured
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - id_token
              properties:
                id_token:
                  type: string
  "/api/v1/auth/session":
    delete:
      summary: Sign out
      tags:
      - Auth
      operationId: logout
      parameters:
      - "$ref": "#/components/parameters/authTransport"
      - "$ref": "#/components/parameters/csrfToken"
      responses:
        '200':
          description: signed out
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Ok"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
  "/api/v1/auth/refresh":
    post:
      summary: Rotate a mobile refresh token
      tags:
      - Auth
      operationId: refreshSession
      parameters:
      - "$ref": "#/components/parameters/authTransport"
      responses:
        '200':
          description: new access and refresh tokens
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuthSession"
        '401':
          description: invalid or reused refresh token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - refresh_token
              properties:
                refresh_token:
                  type: string
  "/api/v1/auth/password":
    post:
      summary: Request a password reset
      tags:
      - Auth
      operationId: requestPasswordReset
      parameters:
      - "$ref": "#/components/parameters/authTransport"
      - "$ref": "#/components/parameters/csrfToken"
      responses:
        '200':
          description: always succeeds
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Ok"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              properties:
                email:
                  type: string
  "/api/v1/auth/password/reset":
    post:
      summary: Set a new password from a reset token
      tags:
      - Auth
      operationId: resetPassword
      parameters:
      - "$ref": "#/components/parameters/authTransport"
      responses:
        '200':
          description: password updated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Ok"
        '422':
          description: invalid token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - token
              - password
              properties:
                token:
                  type: string
                password:
                  type: string
  "/api/v1/health":
    get:
      summary: Readiness check
      tags:
      - System
      operationId: getHealth
      responses:
        '200':
          description: application and database are available
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Health"
  "/api/v1/locales":
    get:
      summary: Supported interface languages
      tags:
      - System
      operationId: listLocales
      parameters:
      - "$ref": "#/components/parameters/locale"
      responses:
        '200':
          description: supported locales, Spanish first and default
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/LocaleList"
  "/api/v1/me":
    get:
      summary: The signed-in student
      tags:
      - Users
      operationId: getMe
      parameters:
      - "$ref": "#/components/parameters/authTransport"
      - name: Authorization
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: current user
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/User"
        '401':
          description: signed out
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
    patch:
      summary: Update the signed-in student
      tags:
      - Users
      operationId: updateMe
      parameters:
      - "$ref": "#/components/parameters/authTransport"
      - "$ref": "#/components/parameters/csrfToken"
      - name: Authorization
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: updated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/User"
        '401':
          description: signed out
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                preferred_locale:
                  "$ref": "#/components/schemas/LocaleCode"
components:
  parameters:
    locale:
      name: locale
      in: query
      required: false
      description: Interface language for messages (overrides Accept-Language).
      schema:
        "$ref": "#/components/schemas/LocaleCode"
    authTransport:
      name: X-Auth-Transport
      in: header
      required: false
      description: cookie for the website session, token for mobile bearer tokens.
      schema:
        type: string
        enum:
        - cookie
        - token
    csrfToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: Required for state-changing cookie-authenticated requests.
      schema:
        type: string
  schemas:
    LocaleCode:
      type: string
      enum:
      - es
      - en
    Error:
      type: object
      required:
      - error
      additionalProperties: false
      properties:
        error:
          type: object
          required:
          - code
          - message
          additionalProperties: false
          properties:
            code:
              type: string
            message:
              type: string
    Health:
      type: object
      required:
      - status
      - database
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
          - ok
          - degraded
        database:
          type: string
          enum:
          - ok
          - unavailable
    Locale:
      type: object
      required:
      - code
      - name
      additionalProperties: false
      properties:
        code:
          "$ref": "#/components/schemas/LocaleCode"
        name:
          type: string
          description: Native language name.
    LocaleList:
      type: object
      required:
      - default_locale
      - locales
      additionalProperties: false
      properties:
        default_locale:
          "$ref": "#/components/schemas/LocaleCode"
        locales:
          type: array
          items:
            "$ref": "#/components/schemas/Locale"
    User:
      type: object
      required:
      - id
      - name
      - email
      - preferred_locale
      additionalProperties: false
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        preferred_locale:
          "$ref": "#/components/schemas/LocaleCode"
    UserSession:
      type: object
      required:
      - user
      additionalProperties: false
      properties:
        user:
          "$ref": "#/components/schemas/User"
    AuthSession:
      type: object
      required:
      - user
      - access_token
      - refresh_token
      - expires_in
      additionalProperties: false
      properties:
        user:
          "$ref": "#/components/schemas/User"
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
    CsrfToken:
      type: object
      required:
      - csrf_token
      additionalProperties: false
      properties:
        csrf_token:
          type: string
    Ok:
      type: object
      required:
      - ok
      additionalProperties: false
      properties:
        ok:
          type: boolean
